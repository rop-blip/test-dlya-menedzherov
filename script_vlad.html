<head>
  <meta charset="UTF-8">

    .block-goal { font-size: 12px; color: #888; }

    .objections-panel { position: fixed; top: 0; right: 0; width: 450px; height: 100vh; background: #fff; box-shadow: -2px 0 12px rgba(0,0,0,0.1); transform: translateX(100%); transition: transform 0.3s; z-index: 1000; display: flex; flex-direction: column; }

    .obj-question { font-weight: 600; margin-bottom: 4px; color: #c62828; }
    .obj-answer { background: #f9f9f9; padding: 8px 12px; border-left: 3px solid #4caf50; border-radius: 4px; white-space: pre-line; font-size: 13px; }

    .btn-danger { background: none; border: 1px solid #dc3545; color: #dc3545; }
    .btn-light { border: 1px solid #ccc; background: #f9f9f9; }
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); z-index: 999; display: none; }
    .overlay.show { display: block; }

    .hint-container { display: flex; align-items: center; background: #e8f0fe; border-radius: 8px; padding: 4px 14px 4px 10px; box-shadow: 0 2px 8px rgba(43,87,154,0.15); flex-shrink: 0; margin-left: 20px; }

<script>
// === ДАННЫЕ ===
const secretaryVariants = [
  { title: "Вариант 1", text: "Добрый день, это компания [Название клиента]? (дожидаемся «да») Это [Имя], компания Паркс-инжиниринг, мы изготавливаем детали на оборудование. Подскажите, пожалуйста, как можно связаться с ответственным за закупку деталей: механиком, инженером или с отделом снабжения? Подскажите, как его(ее) зовут? Соедините с ним(ней), пожалуйста." },

  { q: "ЛПР нет на месте",

  { q: "Не нужно",
    a: "Вариант 1: [Имя], скажу открыто, я работаю со многими фирмами и когда слышу «не нужно» – это либо нет средств, либо нет интереса. Я уверен на 100%, что наши услуги вас заинтересуют. Уделите мне пару минут.\nВариант 2: Тут скорее вопрос не интереса, а сокращения времени простоя оборудования. [Имя], вы лично занимаетесь закупкой деталей? Соедините, пожалуйста, с ответственным лицом.\nВариант 3: Я вам не навязываю услуги. Слышали о новых методах обработки металлоизделий, которые увеличивают срок эксплуатации в 2 раза? У меня всего 3 вопроса для обсуждения с директором, это займет 3 минуты.\nВариант 4: Вы понимаете, что это важное решение? Я не займу много времени у руководителя. Это ничего не стоит вашей компании, зато директор будет доволен от сотрудничества с нами, потому что заинтересован в снижении затрат на изготовление деталей на 20%, согласитесь?" },
  { q: "Приказ ни с кем не соединять / запрещено соединять",
    a: "Вариант 1: (узнаем имя) [Имя], очень приятно. Я буду вам благодарен, если вы передадите директору/начальнику отдела снабжения, что мы занимаемся изготовлением деталей по индивидуальному чертежу и для сферы [сфера клиента] действует скидка [размер скидки]. Я перезвоню завтра, во сколько будет удобно?\nВариант 2: Я не планирую что-то навязывать. Обычно мы оставляем вопрос сотрудничества напоследок, после получения информации от директора о количестве и сроках изготовления деталей. Кстати, вы работаете только по будням? (отвлекающий вопрос) Хорошо, переведёте на директора?" },

    a: "Вариант 1: Конечно, я всё пришлю. Но возможно, у директора возникнут вопросы при самостоятельном изучении, давайте я сейчас расскажу о наших преимуществах более подробно, это займёт 2 минуты.\nВариант 2: Я правильно вас понял, вы заинтересованы в изготовлении деталей по индивидуальному чертежу? (ждем) Продиктуйте, пожалуйста, ваш электронный адрес. Я пришлю информацию сегодня в течение часа. Удобно, если я перезвоню вам сегодня в 15:00 или 17:00?" },

  { q: "Все предложения через секретаря",
    a: "Вариант 1: Т.е. вы ответственны по вопросу о сотрудничестве? (выслушать) Для принятия окончательного решения мне необходимо выслать чертежи [детали], чтобы вы визуально смогли оценить преимущества работы с нами. Я уверен, что вы прекрасно справляетесь с работой секретаря, однако смогли бы вы оценить техническую составляющую данного вопроса (покрытие, размеры и др.)? Соедините, пожалуйста, с ответственным.\nВариант 2: Я уже отправлял КП на почту вашему директору. Сейчас мне поручено узнать, какое решение приняло ваше руководство по вопросу сотрудничества. Возможно, остались вопросы. Согласитесь, только я смогу на них ответить.\nЕсли говорят, что предложения не приходило: «Такого быть не может (удивленно). Видно письмо попало в СПАМ. Тогда тем более я должен обсудить все имеющиеся вопросы»." }

const lprBlocks = [
  { title: "Соединение со специалистом (ЛПР)", text: "Добрый день, [имя директора] (если выяснили у секретаря, если нет – уточните). Меня зовут [ваше имя]. Компания Паркс-инжиниринг. Мы занимаемся серийным изготовлением деталей по чертежу заказчика из нержавеющей стали и других материалов для [сфера клиента]. Скажите, вы используете услуги по токарной обработке металла?\nЕсли нет: «Это не наше».\nЕсли да: Хорошо. [Имя клиента], скажу открыто, я предлагаю сотрудничество с нашей компанией. Разрешите мне рассказать о преимуществах работы с нами. Если будет интересно, продолжим беседу, сделаем пробный заказ, если нет – зато вы будете уверены, что то предложение, которое у вас сейчас – самое выгодное на рынке, разговор займёт не более 2-х минут, хорошо? Переходите к выявлению потребности." },
  { title: "Выявление потребности", text: "Скажите, пожалуйста, какие детали используете? Сами изготавливаете или заказываете у сторонней компании? В каком количестве приобретаете? С какой периодичностью? Сколько в месяц уходит на закупку/изготовление деталей?\nНа данном этапе важно задать те вопросы, которые помогут в дальнейшем обработать возражение. Задавайте дополнительные вопросы исходя из вашего опыта, а также сферы деятельности клиента." },
  { title: "Презентация", text: "Благодарю за подробные ответы. Мы уже более 5 лет изготавливаем детали для компаний по всей России. Все работы выполняем на современных станках с ЧПУ, поэтому детали высочайшего качества и точности. Строго следуем ТЗ заказчика, все детали проходят проверку качества. В случае необходимости наши специалисты готовы помочь с составлением технической документации. Работая с нами, вы будете уверены не только в качестве деталей, но и в соблюдении всех договоренностей и сроков поставки.\nКак вам наше предложение? Готовы сотрудничать?" },
  { title: "Закрытие на цель", text: "Хорошо, необходимо будет отправить ваш чертеж нам на почту для расчета стоимости изготовления. Удобно записать адрес? (продиктовать). Также укажите, пожалуйста, необходимое количество деталей. После получения чертежа мы отправим счет на согласование. Необходимо будет внести предоплату в размере от 20 до 50% от стоимости. После этого приступим к изготовлению. Услугами какой транспортной компании пользуетесь? (обсудить доставку)\nБлагодарю, [имя клиента]. Будут вопросы – обязательно звоните. Хорошего дня. До свидания!" },
  { title: "Закрытие на повторный звонок", text: "[Имя клиента], когда вам лучше перезвонить? (записать дату и время)\nЕсли есть КП: давайте я пришлю на почту КП, вы рассмотрите его более детально, возникнут вопросы – обсудим при повторном звонке, хорошо? (записать почту, отправить)\nБлагодарю! Всего доброго, до свидания!" }

    { q: "Ничего не нужно (1)", a: "Уточните, пожалуйста, не надо сейчас или планируете заказывать у другой компании?" },

  ]},

    { q: "Не интересно (3)", a: "Хорошо, если вам не интересно наше предложение, я задам вам 3 вопроса, если вы на них ответите положительно, значит сотрудничество с нами всё-таки принесёт вам результат.\n• Вы хотите сэкономить на изготовлении деталей до 20% стоимости?\n• Вы хотите увеличить сроки эксплуатации оборудования за счет использования деталей высокого качества?\n• Вы заинтересованы в сотрудничестве с организацией, которая предложит лучшие условия по доставке, изготовлению деталей?\nМы дорожим каждым клиентом. Уверен, вы сами это оцените. Давайте закажем пробную партию?" }

// === РЕНДЕР ВКЛАДОК ===
function renderTab(tab) {
  const container = document.getElementById('tabContent');
  let html = '';
  if (tab === 'secretary') {
    secretaryVariants.forEach((v, i) => {
      html += `<div class="script-block collapsed" id="sec-${i}">
        <div class="block-header" onclick="toggleBlock(this)"><span><span class="arrow">▶</span> <span class="block-title">${v.title}</span></span><span class="block-goal">Приветствие, проход секретаря</span></div>
        <div class="block-body"><div class="script-text">${v.text}</div></div></div>`;
    });
  } else if (tab === 'reactions') {
    secretaryReactions.forEach((r, i) => {
      html += `<div class="script-block collapsed" id="react-${i}">
        <div class="block-header" onclick="toggleBlock(this)"><span><span class="arrow">▶</span> <span class="block-title">${r.q}</span></span><span class="block-goal">Ответ менеджера</span></div>
        <div class="block-body"><div class="script-text">${r.a}</div></div></div>`;
    });
  } else if (tab === 'lpr') {
    lprBlocks.forEach((b, i) => {
      html += `<div class="script-block collapsed" id="lpr-${i}">
        <div class="block-header" onclick="toggleBlock(this)"><span><span class="arrow">▶</span> <span class="block-title">${b.title}</span></span><span class="block-goal"></span></div>
        <div class="block-body"><div class="script-text">${b.text}</div></div></div>`;
    });
  }
  container.innerHTML = html;
}

window.toggleBlock = function(header) {
  const block = header.parentElement;
  block.classList.toggle('collapsed');
  const arrow = block.querySelector('.arrow');
  if (arrow) arrow.textContent = block.classList.contains('collapsed') ? '▶' : '▼';
};

// Панель возражений
const overlay = document.getElementById('overlay');
const panel = document.getElementById('objPanel');
document.getElementById('openPanelBtn').onclick = () => {
  panel.classList.add('open');
  overlay.classList.add('show');
  let html = '';
  objections.forEach(group => {
    html += `<div class="obj-group"><div class="obj-group-title">${group.group}</div>`;
    group.items.forEach(item => {
      html += `<div class="obj-item"><div class="obj-question">${item.q}</div><div class="obj-answer">${item.a}</div></div>`;
    });
    html += `</div>`;
  });
  document.getElementById('objContent').innerHTML = html;
};
document.getElementById('closePanelBtn').onclick = () => { panel.classList.remove('open'); overlay.classList.remove('show'); };
overlay.onclick = () => { panel.classList.remove('open'); overlay.classList.remove('show'); };

// Переключение вкладок
document.getElementById('mainTabs').addEventListener('click', e => {
  if (e.target.classList.contains('switch-tab')) {
    document.querySelectorAll('#mainTabs .switch-tab').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    renderTab(e.target.dataset.tab);
  }
});

renderTab('secretary');
</script>
