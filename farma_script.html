<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Скрипт «ФАРМА» – помощник менеджера</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; padding: 20px; font-size: 13px; }
    .workspace { max-width: 850px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    
    .card-header { background: #f5f5f5; padding: 16px 20px; border-bottom: 1px solid #ddd; display: flex; flex-direction: column; gap: 6px; }
    .header-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: nowrap; width: 100%; }
    .header-title { flex: 1 1 auto; min-width: 0; }
    .header-title h2 { font-size: 20px; font-weight: 700; color: #1a3a5c; margin: 0; line-height: 1.2; }
    .header-subtitle { font-size: 12px; color: #666; margin-top: 2px; }
    .header-company { font-size: 12px; color: #444; margin-top: 2px; }
    
    .card-body { padding: 16px 20px; }
    .switch-tabs { display: flex; border-bottom: 2px solid #ddd; margin-bottom: 16px; }
    .switch-tab { padding: 8px 16px; cursor: pointer; border: none; background: none; font-size: 13px; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .switch-tab.active { color: #2b579a; border-bottom-color: #2b579a; font-weight: 600; }
    .script-block { border: 1px solid #ddd; border-radius: 6px; margin-bottom: 12px; overflow: hidden; }
    .block-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #fafafa; cursor: pointer; user-select: none; }
    .block-header:hover { background: #f0f0f0; }
    .block-title { font-weight: 600; }
    .block-goal { font-size: 12px; color: #888; }
    .block-body { padding: 12px 14px; border-top: 1px solid #ddd; background: #fff; }
    .script-text { background: #f9f9f9; border-left: 3px solid #2b579a; padding: 10px 14px; border-radius: 4px; font-style: italic; margin-bottom: 8px; white-space: pre-line; font-size: 15px; }
    .collapsed .block-body { display: none; }
    .collapsed .arrow { transform: rotate(0deg); }
    .arrow { transition: transform 0.2s; display: inline-block; width: 20px; text-align: center; }

    .objections-panel { position: fixed; top: 0; right: 0; width: 420px; height: 100vh; background: #fff; box-shadow: -2px 0 12px rgba(0,0,0,0.1); transform: translateX(100%); transition: transform 0.3s; z-index: 1000; display: flex; flex-direction: column; }
    .objections-panel.open { transform: translateX(0); }
    .panel-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid #ddd; }
    .panel-body { flex: 1; overflow-y: auto; padding: 16px; font-size: 14px; }
    .obj-item { margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 16px; }
    .obj-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .obj-question { font-weight: 600; margin-bottom: 6px; color: #c62828; }
    .obj-answer { background: #f9f9f9; padding: 8px 12px; border-left: 3px solid #4caf50; border-radius: 4px; white-space: pre-line; }

    .btn { padding: 6px 14px; border-radius: 4px; font-size: 13px; cursor: pointer; border: 1px solid #ccc; background: #fff; color: #333; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: #2b579a; color: white; border-color: #2b579a; font-size: 13px; }
    .btn-danger { background: none; border: 1px solid #dc3545; color: #dc3545; }
    .btn-light { border: 1px solid #ccc; background: #f9f9f9; }
    .btn-light:hover { background: #f0f0f0; }
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); z-index: 999; display: none; }
    .overlay.show { display: block; }

    .hint-container {
      display: flex;
      align-items: center;
      background: #e8f0fe;
      border-radius: 8px;
      padding: 4px 14px 4px 10px;
      box-shadow: 0 2px 8px rgba(43,87,154,0.15);
      flex-shrink: 0;
      margin-left: 20px;
    }
    .hint-arrow {
      display: inline-block;
      width: 0;
      height: 0;
      border-top: 14px solid transparent;
      border-bottom: 14px solid transparent;
      border-left: 20px solid #2b579a;
      margin-right: 8px;
      animation: gentle-bounce 2s infinite ease-in-out;
    }
    @keyframes gentle-bounce {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-6px); }
    }
  </style>
</head>
<body>
<div class="workspace">
  <div class="card">
    <div class="card-header">
      <div class="header-row">
        <div class="header-title">
          <h2>📞 Скрипт «ФАРМА»</h2>
        </div>
        <div class="hint-container">
          <span class="hint-arrow"></span>
          <button class="btn btn-primary" id="openPanelBtn">📋 Возражения и готовые ответы</button>
        </div>
      </div>
      <div class="header-subtitle">Изготовление деталей для фармацевтического оборудования: таблетпрессы, линии розлива, упаковочные автоматы, лабораторные приборы</div>
      <div class="header-company">Активен: ГРАЙНЕР ПЭКЭДЖИН ООО</div>
    </div>
    <div class="card-body">
      <div style="margin-bottom:12px;"><strong>Выберите начало разговора:</strong></div>
      <div class="switch-tabs" id="approachTabs">
        <button class="switch-tab active" data-approach="direct">🗣️ Прямое общение с ЛПР</button>
        <button class="switch-tab" data-approach="soft">🔑 Обход секретаря</button>
      </div>
      <div id="approachContent"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header" style="flex-direction: row; align-items: center;">
      <h2 style="flex:1; margin:0;">📋 Блоки скрипта</h2>
      <button class="btn btn-light" id="toggleAllBtn" onclick="toggleAllBlocks()" style="white-space: nowrap;">
        <span id="toggleAllIcon">⇵</span> <span id="toggleAllText">Развернуть всё</span>
      </button>
    </div>
    <div class="card-body" id="blocksContainer"></div>
  </div>
</div>

<div class="overlay" id="overlay"></div>

<div class="objections-panel" id="objPanel">
  <div class="panel-header">
    <h3 style="font-size:16px;">🛡️ Возражения и готовые ответы</h3>
    <button class="btn btn-danger" id="closePanelBtn">✕ Закрыть</button>
  </div>
  <div class="panel-body" id="objContent"></div>
</div>

<script>
  const approaches = {
    direct: {
      label: '🗣️ Прямое общение с ЛПР',
      intro: '«Здравствуйте, меня зовут [Имя]. Компания Паркс Инжиниринг — мы специализируемся на изготовлении высокоточных деталей по чертежам из металлов и инженерных пластмасс на станках с ЧПУ, в том числе по образцам (обратный инжиниринг).»',
      note: 'Используйте, когда ЛПР на проводе. Быстро и ёмко обозначает суть, вызывает доверие.'
    },
    soft: {
      label: '🔑 Обход секретаря',
      variants: [
        { title: '🔑 Узкопрофильные вопросы', text: '«Здравствуйте! Я хочу задать два узкопрофильных вопроса вашему главному инженеру — чтобы точно знать, сможем ли мы быть вам полезны. Соедините, пожалуйста.»' },
        { title: '🔑 Приём с именем', text: '«Добрый день! От вас был звонок, коллеги записали, что звонил снабженец по вопросу изготовления деталей по чертежам. Соедините с ним!»' },
        { title: '🔑 Ошибка в имени', text: '«А как правильно имя и отчество?.. А, точно! Не туда посмотрел. Соедините с ним!» (если секретарь говорит, что такого нет)' },
        { title: '🔑 Жёсткий фильтр', text: '«Наверняка вам запрещено соединять с теми, кто звонит по пустякам. Я не предлагаю купить у меня канцтовары или салфетки — я звоню по вопросу изготовления высокоточных деталей из любого металла и инженерных пластмасс. Соедините с главным инженером!»' },
        { title: '🔑 Наследство от коллеги', text: '«Мне в наследство досталась база моего коллеги Ивана. Он работал с вашей компанией. Судя по последним записям, у вас был интерес к нашему оборудованию. Звоню, чтобы переговорить с отделом снабжения. Соедините!»' }
      ],
      note: 'После успешного обхода секретаря используйте вкладку «Прямое общение с ЛПР» для представления.'
    }
  };

  const blocks = [
    {
      id: 'B', icon: '💊', title: 'Б. Привязка к отрасли', goal: 'Показать знание специфики',
      text: '«Знаю, что фармацевтические производства — это зона высочайшей ответственности. Здесь критически важны не только точность и чистота обработки, но и правильный подбор материалов, способных выдерживать многократную стерилизацию и контакт с агрессивными средами. Ошибка в материале или допуске может стоить целой партии продукта. Поэтому мы делаем ставку на бескомпромиссное качество изготовления и готовность работать даже с самыми сложными материалами — от фторопласта до титана.»'
    },
    {
      id: 'C', icon: '🏭', title: 'В. Релевантный пример', goal: 'Привести живой кейс',
      text: '«Например, для одного из крупнейших фармпроизводителей — компании Фармасинтез — мы полностью переоснастили линию по розливу инсулина. Изготовили лапки захвата, пластины, направляющие и корпуса из полиацеталя и нержавейки. Детали работают в условиях многократной стерилизации — заказчик сократил простои линии на 30%. Это позволило им увеличить выпуск продукции без дополнительных капитальных затрат.»'
    },
    {
      id: 'D', icon: '💎', title: 'Г. Ценностное предложение', goal: 'Что мы умеем и чем полезны',
      text: '«Работаем с фторопластом, PEEK, полиацеталем, нержавеющими сталями, титаном. Делаем единичные образцы и серии, предоставляем полный пакет документации. Особое внимание — чистоте и отсутствию заусенцев, это принципиально для фармы.»'
    },
    {
      id: 'E', icon: '📞', title: 'Д. Призыв к действию', goal: 'Вовлечь в диалог, получить чертежи',
      text: '«Скажите, есть ли сейчас потребность в изготовлении или ремонте деталей для оборудования? Я готов оперативно просчитать стоимость и сроки по вашим чертежам или эскизам.»'
    }
  ];

  const objections = [
    { q: '«У нас уже есть поставщик, всё устраивает»', a: '«Это отлично. А при условии, что всё устраивает, что бы вы хотели улучшить? Может, сроки или редкие материалы?»\n\n«Получив второго партнёра по сложным деталям, вы сможете сравнивать условия и выбирать лучшее.»' },
    { q: '«У вас дороже»', a: '«Я подготовил предложение, где цены в среднем на 30% выше контрафактных аналогов. Но мы работаем под ключ: любые сложные материалы, покрытия, закалка, полный сервис. Большинство клиентов после детального разбора выбирают нас.»' },
    { q: '«Мне важна только цена»', a: '«Иногда клиентов интересует только цена. Чтобы я подготовил оптимальное предложение — подскажите, на что ещё обратить внимание: долговечность, точность, сроки?»\n\n«Если действительно только цена, я могу дать контакты кустарного производства. Но уверен, вам важны и сроки, и ремонтопригодность. Это так?»' },
    { q: '«Скиньте информацию на почту»', a: '«Обязательно пришлю. Но в тексте лишь общая канва, она требует пояснений. Давайте я сейчас коротко пройдусь по ключевым моментам — это займёт пару минут.»' },
    { q: '«Пришлите предложение, мы изучим»', a: '«Вы наверняка получаете десятки предложений. Я предлагаю инвестировать пять минут в разговор сейчас вместо получаса чтения бумаг. После разговора я предоставлю адресное КП на одном листе.»' },
    { q: '«Склад полон, ничего не надо»', a: '«Это замечательно! Значит, можем спокойно обсудить перспективное сотрудничество. И если будет интерес — приезжайте к нам, своими глазами увидите производство.»' },
    { q: '«Вы свалились как снег на голову»', a: '«Скажите, вы недавно произвели закупку? Или дело в том, что у вас пока нет полной информации о нашей компании, чтобы понять, чем мы отличаемся от других?»' },
    { q: '«У нас своё производство, сами справляемся»', a: '«Это замечательно, что вы самодостаточны. Давайте обсудим, чем мы можем быть полезны в пиковые нагрузки или по редким операциям. И приезжайте к нам, посмотрите оборудование.»' },
    { q: '«Не меняем поставщиков в середине года»', a: '«Что же мне всё-таки нужно сделать, чтобы мы могли начать сотрудничество раньше? Как можно обойти это правило?»' },
    { q: '«Нам надо подумать, перезвоните через месяц»', a: '«Знаю, что за фразой "надо подумать" часто стоит другая причина. Скажите честно, что вас останавливает?»' },
    { q: '«Я должен подумать, это не быстрое решение»', a: '«Если бы наше сотрудничество уже приносило вам прибыль, вам было бы нужно думать? Давайте я сейчас отвечу на вопросы, которые вас смущают.»' },
    { q: '«Почему я должен работать с вами?»', a: '«Я вовсе не говорю, что вы должны всё бросить и переключиться на нас. Я предлагаю возможность сравнить и выбрать. Получив ещё одного партнёра по сложным деталям, вы только выиграете.»' },
    { q: '«Скиньте предложение, я покажу директору»', a: '«Я обязательно отправлю. Но чтобы директор принял взвешенное решение, давайте я сначала уточню у вас пару моментов: что для него сейчас важнее — снижение цены или сокращение сроков?»' }
  ];

  function renderApproach(approach) {
    const container = document.getElementById('approachContent');
    const d = approaches[approach];
    if (approach === 'direct') {
      container.innerHTML = `<div class="script-block"><div class="block-header" onclick="toggleBlock(this)"><span><span class="arrow">▼</span> <span class="block-title">${d.label}</span></span><span class="block-goal">Представление</span></div><div class="block-body"><div class="script-text">${d.intro}</div><div style="font-size:12px; color:#666;">${d.note}</div></div></div>`;
    } else {
      let variantsHtml = '';
      d.variants.forEach((v, index) => { variantsHtml += `<div class="script-block collapsed" id="variant-${index}"><div class="block-header" onclick="toggleBlock(this)"><span><span class="arrow">▶</span> <span class="block-title">${v.title}</span></span><span class="block-goal">Фраза</span></div><div class="block-body"><div class="script-text">${v.text}</div></div></div>`; });
      container.innerHTML = `<div style="margin-bottom:12px; font-size:12px; color:#666;">${d.note}</div>${variantsHtml}`;
    }
  }

  function renderBlocks() {
    let html = '';
    blocks.forEach(b => { html += `<div class="script-block collapsed" id="block-${b.id}"><div class="block-header" onclick="toggleBlock(this)"><span><span class="arrow">▶</span> <span class="block-title">${b.icon} ${b.title}</span></span><span class="block-goal">${b.goal}</span></div><div class="block-body"><div class="script-text">${b.text}</div></div></div>`; });
    document.getElementById('blocksContainer').innerHTML = html;
  }

  // Переключение отдельного блока
  window.toggleBlock = function(header) {
    const block = header.parentElement;
    block.classList.toggle('collapsed');
    const arrow = block.querySelector('.arrow');
    if (arrow) arrow.textContent = block.classList.contains('collapsed') ? '▶' : '▼';
    updateToggleAllButton();
  };

  // Переключение всех блоков (Б-Д и вариантов обхода)
  function toggleAllBlocks() {
    const allBlocks = document.querySelectorAll('.script-block');
    const anyCollapsed = Array.from(allBlocks).some(block => block.classList.contains('collapsed'));
    if (anyCollapsed) {
      // Разворачиваем все
      allBlocks.forEach(block => {
        block.classList.remove('collapsed');
        const arrow = block.querySelector('.arrow');
        if (arrow) arrow.textContent = '▼';
      });
    } else {
      // Сворачиваем все
      allBlocks.forEach(block => {
        block.classList.add('collapsed');
        const arrow = block.querySelector('.arrow');
        if (arrow) arrow.textContent = '▶';
      });
    }
    updateToggleAllButton();
  }

  function updateToggleAllButton() {
    const allBlocks = document.querySelectorAll('.script-block');
    const anyCollapsed = Array.from(allBlocks).some(block => block.classList.contains('collapsed'));
    const icon = document.getElementById('toggleAllIcon');
    const text = document.getElementById('toggleAllText');
    if (anyCollapsed) {
      icon.textContent = '⇵';
      text.textContent = 'Развернуть всё';
    } else {
      icon.textContent = '⇅';
      text.textContent = 'Свернуть всё';
    }
  }

  // Панель возражений
  const overlay = document.getElementById('overlay'), panel = document.getElementById('objPanel'),
        openBtn = document.getElementById('openPanelBtn'), closeBtn = document.getElementById('closePanelBtn');
  function openPanel() {
    panel.classList.add('open'); overlay.classList.add('show');
    let html = '';
    objections.forEach(o => { html += `<div class="obj-item"><div class="obj-question">${o.q}</div><div class="obj-answer">${o.a}</div></div>`; });
    document.getElementById('objContent').innerHTML = html;
  }
  function closePanel() { panel.classList.remove('open'); overlay.classList.remove('show'); }
  openBtn.addEventListener('click', openPanel);
  closeBtn.addEventListener('click', closePanel);
  overlay.addEventListener('click', closePanel);

  // Переключение вкладок начала
  document.getElementById('approachTabs').addEventListener('click', e => {
    if (e.target.classList.contains('switch-tab')) {
      document.querySelectorAll('.switch-tab').forEach(t => t.classList.remove('active'));
      e.target.classList.add('active');
      renderApproach(e.target.dataset.approach);
    }
  });

  // Старт
  renderApproach('direct');
  renderBlocks();
  updateToggleAllButton();
</script>
</body>
</html>
